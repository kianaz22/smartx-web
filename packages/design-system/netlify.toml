[build]
  command = "pnpm build-storybook"
  publish = "storybook-static"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.deploy-preview]
  command = "pnpm build-storybook"

[context.branch-deploy]
  command = "pnpm build-storybook"
