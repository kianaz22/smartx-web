stages:
  - build
  - deploy

variables:
  NODE_VERSION: "18"

build-storybook:
  stage: build
  image: node:18-alpine
  cache:
    paths:
      - node_modules/
      - packages/design-system/node_modules/
  before_script:
    - npm install -g pnpm@8
    - cd packages/design-system
    - pnpm install --frozen-lockfile
  script:
    - pnpm build-storybook
  artifacts:
    paths:
      - packages/design-system/storybook-static/
    expire_in: 1 hour
  only:
    - development
    - merge_requests

deploy-to-netlify:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache curl
  script:
    - |
      # Deploy to Netlify using their API
      curl -H "Content-Type: application/zip" \
           -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
           --data-binary "@packages/design-system/storybook-static.zip" \
           "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys"
  dependencies:
    - build-storybook
  only:
    - development
  when: manual
  environment:
    name: production
    url: https://$NETLIFY_SITE_ID.netlify.app
